# Prebuilt SCORM Editor: serves the already-built site in ./site with the stock
# nginx image, so this machine doesn't build anything (and any CPU type works).
# To update: replace ./site with a newer package's site folder, then run
#   docker compose --profile tunnel up -d
services:
  scorm-editor:
    image: nginx:1.27-alpine
    container_name: scorm-editor
    ports:
      - "8081:80"
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 5s

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: scorm-editor-tunnel
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - scorm-editor
    restart: unless-stopped
    # Opt-in: only starts with `docker compose --profile tunnel up -d`
    # (so plain local runs don't need a TUNNEL_TOKEN). Requires .env with the token.
    profiles: ["tunnel"]
